<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shader Background · Lobo Motion</title>
<style>
  html, body { margin: 0; height: 100%; background: #0a0a0a; }
  /* Caixa no large viewport: a barra do Safari não realoca o canvas (rule, fix-catalog §4). */
  .scene { position: relative; width: 100%; height: 100lvh; overflow: hidden; transform: translateZ(0); }
  .scene canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  /* Robot form e fallback sem WebGL: um gradiente CSS com as mesmas cores, sem download de shader. */
  .fallback { position: absolute; inset: 0; display: none; background: linear-gradient(220deg, var(--c0, #0a0a0a), var(--c2, #525252), var(--c4, #f5f5f5)); }
  .scene.static .fallback { display: block; }
  .scene.static canvas { display: none; }
</style>
</head>
<body>
<div class="scene" data-lobo-scene>
  <canvas id="bg" aria-hidden="true"></canvas>
  <div class="fallback" aria-hidden="true"></div>
</div>
<script>
// ============================================================================
// CONFIG: a fonte da verdade. Painel, URL (?s=), favorito e build prompt leem daqui.
// Schema e ranges: ../references/config-schema.md
// ============================================================================
const PRESETS = {
  graphite:   { colors: ["#0A0A0A", "#262626", "#525252", "#A3A3A3", "#F5F5F5"], shape: "warped", zoom: 1.3, swirl: 0.3,  movement: 0.35, speed: 0.6, angle: 220, contrast: 1.1,  grain: 0.1 },
  lagoon:     { colors: ["#041A2E", "#0B4F6C", "#01BAEF", "#8AE9C1", "#F6FFF8"], shape: "warped", zoom: 1.1, swirl: 0.45, movement: 0.5,  speed: 0.5, angle: 200, contrast: 1.05, grain: 0.06 },
  molten:     { colors: ["#0B0302", "#5A0F07", "#C8320E", "#FF8A1F", "#FFE6A7"], shape: "mesh",   zoom: 1.0, swirl: 0.2,  movement: 0.6,  speed: 0.8, angle: 160, contrast: 1.15, grain: 0.12 },
  "neon-dream": { colors: ["#0A0014", "#3A0CA3", "#7209B7", "#F72585", "#FFD6FF"], shape: "radial", zoom: 1.4, swirl: 0.6, movement: 0.4, speed: 0.7, angle: 240, contrast: 1.1, grain: 0.08 }
};
const CONFIG = {
  preset: "graphite",
  colors: PRESETS.graphite.colors,
  stops: [0, 0.25, 0.5, 0.75, 1],
  shape: "warped",             // linear | radial | conic | mesh | warped
  zoom: 1.3, swirl: 0.3, movement: 0.35, speed: 0.6,
  angle: 220, centerX: 0.5, centerY: 0.5,
  detail: 1, contrast: 1.1, grain: 0.1, grainSize: 1,
  seed: 0, dprMax: 1.5
};

(function () {
  const scene = document.querySelector("[data-lobo-scene]");
  const canvas = document.getElementById("bg");
  const motionOff = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const coarse = matchMedia("(hover: none) and (pointer: coarse)").matches;
  const isBot = /bot|crawl|spider|slurp|headless|lighthouse|pagespeed/i.test(navigator.userAgent);
  const stats = { frames: 0, draws: 0, links: 0, lost: 0, restored: 0, resizes: 0 };
  // variáveis do loop declaradas antes de qualquer setConfig/schedule (evita TDZ quando a URL traz ?preset= ou ?s=)
  let prog = null, U = {}, raf = 0, last = performance.now(), time = 0, dirty = true, visible = !document.hidden, inView = true;

  // ---- estado: preset e URL sobre o CONFIG (só chaves conhecidas) ----
  const cfg = Object.assign({}, CONFIG);
  const params = new URLSearchParams(location.search);
  function setConfig(changes) {
    const ignored = [];
    for (const k in changes) { if (k in cfg) cfg[k] = changes[k]; else ignored.push(k); }
    dirty = true; schedule();
    return { ignored };
  }
  if (params.get("preset") && PRESETS[params.get("preset")]) { cfg.preset = params.get("preset"); setConfig(PRESETS[cfg.preset]); }
  if (params.get("s")) { try { setConfig(JSON.parse(atob(params.get("s").replace(/-/g, "+").replace(/_/g, "/")))); } catch (e) { /* estado inválido: ignora */ } }
  function exportState() {
    const b = btoa(JSON.stringify(cfg)).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
    return location.origin + location.pathname + "?s=" + b;
  }
  window.__lobo = { config: cfg, presets: PRESETS, stats, setConfig, exportState, family: "shader-background" };
  scene.style.setProperty("--c0", cfg.colors[0]); scene.style.setProperty("--c2", cfg.colors[Math.floor(cfg.colors.length / 2)]); scene.style.setProperty("--c4", cfg.colors[cfg.colors.length - 1]);

  // ---- robot form: crawler recebe o fallback estático, sem WebGL ----
  if (isBot) { scene.classList.add("static"); return; }

  const gl = canvas.getContext("webgl2", { alpha: false, antialias: false, depth: false, stencil: false, powerPreference: coarse ? "default" : "high-performance" });
  if (!gl) { scene.classList.add("static"); return; }

  // ---- shaders (ruído e OKLab vêm do cookbook da skill) ----
  const VERT = `#version 300 es
  void main(){ vec2 p = vec2((gl_VertexID << 1) & 2, gl_VertexID & 2); gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0); }`;
  const FRAG = `#version 300 es
  precision highp float;
  out vec4 fragColor;
  uniform vec2 uResolution, uCenter; uniform float uTime, uSeed, uZoom, uSwirl, uMovement, uAngle, uDetail, uContrast, uGrain, uGrainSize;
  uniform vec3 uColors[6]; uniform float uStops[6]; uniform int uShape, uCount;
  vec3 mod289(vec3 x){ return x - floor(x * (1.0 / 289.0)) * 289.0; }
  vec2 mod289(vec2 x){ return x - floor(x * (1.0 / 289.0)) * 289.0; }
  vec3 permute(vec3 x){ return mod289(((x * 34.0) + 1.0) * x); }
  float snoise(vec2 v){
    const vec4 C = vec4(0.211324865405187, 0.366025403784439, -0.577350269189626, 0.024390243902439);
    vec2 i = floor(v + dot(v, C.yy)); vec2 x0 = v - i + dot(i, C.xx);
    vec2 i1 = (x0.x > x0.y) ? vec2(1.0, 0.0) : vec2(0.0, 1.0);
    vec4 x12 = x0.xyxy + C.xxzz; x12.xy -= i1; i = mod289(i);
    vec3 p = permute(permute(i.y + vec3(0.0, i1.y, 1.0)) + i.x + vec3(0.0, i1.x, 1.0));
    vec3 m = max(0.5 - vec3(dot(x0, x0), dot(x12.xy, x12.xy), dot(x12.zw, x12.zw)), 0.0); m = m * m; m = m * m;
    vec3 x = 2.0 * fract(p * C.www) - 1.0; vec3 h = abs(x) - 0.5; vec3 ox = floor(x + 0.5); vec3 a0 = x - ox;
    m *= 1.79284291400159 - 0.85373472095314 * (a0 * a0 + h * h);
    vec3 g; g.x = a0.x * x0.x + h.x * x0.y; g.yz = a0.yz * x12.xz + h.yz * x12.yw;
    return 130.0 * dot(m, g);
  }
  float fbm(vec2 p){ float v = 0.0, a = 0.5; mat2 r = mat2(0.8, 0.6, -0.6, 0.8); for (int i = 0; i < 5; i++){ v += a * snoise(p); p = r * p * 2.0 + 17.3; a *= 0.5; } return v * 0.5 + 0.5; }
  float hash21(vec2 p){ p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
  vec3 toLinear(vec3 c){ return pow(c, vec3(2.2)); }
  vec3 toSrgb(vec3 c){ return pow(max(c, 0.0), vec3(1.0 / 2.2)); }
  vec3 toOklab(vec3 c){
    float l = 0.4122214708 * c.r + 0.5363325363 * c.g + 0.0514459929 * c.b;
    float m = 0.2119034982 * c.r + 0.6806995451 * c.g + 0.1073969566 * c.b;
    float s = 0.0883024619 * c.r + 0.2817188376 * c.g + 0.6299787005 * c.b;
    float l_ = pow(max(l, 0.0), 1.0 / 3.0), m_ = pow(max(m, 0.0), 1.0 / 3.0), s_ = pow(max(s, 0.0), 1.0 / 3.0);
    return vec3(0.2104542553 * l_ + 0.7936177850 * m_ - 0.0040720468 * s_, 1.9779984951 * l_ - 2.4285922050 * m_ + 0.4505937099 * s_, 0.0259040371 * l_ + 0.7827717662 * m_ - 0.8086757660 * s_);
  }
  vec3 fromOklab(vec3 c){
    float l_ = c.x + 0.3963377774 * c.y + 0.2158037573 * c.z, m_ = c.x - 0.1055613458 * c.y - 0.0638541728 * c.z, s_ = c.x - 0.0894841775 * c.y - 1.2914855480 * c.z;
    float l = l_ * l_ * l_, m = m_ * m_ * m_, s = s_ * s_ * s_;
    return vec3(4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s, -1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s, -0.0041960863 * l - 0.7034186147 * m + 1.7076147010 * s);
  }
  mat2 rot(float a){ return mat2(cos(a), -sin(a), sin(a), cos(a)); }
  float shapeT(vec2 p, float t){
    float n = fbm(p * (1.5 * uDetail) + uSeed * 0.37 + t);
    if (uShape == 0) return clamp(p.x * 0.6 + 0.5 + (n - 0.5) * uMovement * 0.8, 0.0, 1.0);
    if (uShape == 1) return clamp(length(p) * 1.1 + (n - 0.5) * uMovement * 0.6, 0.0, 1.0);
    if (uShape == 2) return fract(atan(p.y, p.x) / 6.28318530718 + 0.5 + (n - 0.5) * uMovement * 0.4);
    if (uShape == 3) { float m = fbm(p * 1.2 * uDetail + t * 0.7 + 10.0 + uSeed); return clamp(m * 0.55 + 0.25 + (n - 0.5) * uMovement * 0.5, 0.0, 1.0); }
    vec2 q = p + uMovement * vec2(fbm(p * uDetail + t + uSeed) - 0.5, fbm(p * uDetail + 5.2 - t) - 0.5) * 2.0;
    return clamp(length(q) * 0.95 + 0.12 * sin(q.x * 3.0 + t), 0.0, 1.0);
  }
  vec3 gradient(float t){
    vec3 c = toOklab(toLinear(uColors[0]));
    for (int i = 1; i < 6; i++){ if (i >= uCount) break; c = mix(c, toOklab(toLinear(uColors[i])), smoothstep(uStops[i - 1], uStops[i], t)); }
    return toSrgb(fromOklab(c));
  }
  void main(){
    vec2 uv = gl_FragCoord.xy / uResolution;
    vec2 p = (uv - uCenter) * vec2(uResolution.x / uResolution.y, 1.0);
    float t = uTime * 0.15;
    p = rot(radians(uAngle)) * p / max(uZoom, 0.05);
    p = rot(uSwirl * length(p) * 2.0) * p;
    vec3 col = gradient(shapeT(p, t));
    col = (col - 0.5) * uContrast + 0.5;
    col += (hash21(floor(gl_FragCoord.xy / max(uGrainSize, 1.0)) + fract(uTime) * 13.0) - 0.5) * uGrain;
    fragColor = vec4(clamp(col, 0.0, 1.0), 1.0);
  }`;

  function compile(type, src) { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; }
  function build() {
    prog = gl.createProgram(); gl.attachShader(prog, compile(gl.VERTEX_SHADER, VERT)); gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FRAG)); gl.linkProgram(prog); stats.links++;
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
    gl.useProgram(prog); U = {};
    for (const n of ["uResolution", "uCenter", "uTime", "uSeed", "uZoom", "uSwirl", "uMovement", "uAngle", "uDetail", "uContrast", "uGrain", "uGrainSize", "uShape", "uCount"]) U[n] = gl.getUniformLocation(prog, n);
    U.uColors = gl.getUniformLocation(prog, "uColors[0]"); U.uStops = gl.getUniformLocation(prog, "uStops[0]");
  }
  const SHAPES = { linear: 0, radial: 1, conic: 2, mesh: 3, warped: 4 };
  const hex = (h) => { const n = parseInt(h.replace("#", ""), 16); return [((n >> 16) & 255) / 255, ((n >> 8) & 255) / 255, (n & 255) / 255]; };

  // ---- resize só em mudança real; DPR clampado (phone 1.25, desktop cfg.dprMax) ----
  let w = 0, h = 0, dpr = 0;
  function resize() {
    const r = scene.getBoundingClientRect();
    const d = Math.min(cfg.dprMax, coarse ? 1.25 : 1.5, window.devicePixelRatio || 1);
    const nw = Math.max(1, Math.round(r.width * d)), nh = Math.max(1, Math.round(r.height * d));
    if (nw === w && nh === h && d === dpr) return false;
    w = nw; h = nh; dpr = d; canvas.width = w; canvas.height = h; gl.viewport(0, 0, w, h); stats.resizes++; return true;
  }

  function draw() {
    const colors = new Float32Array(18), stops = new Float32Array(6), n = Math.min(6, cfg.colors.length);
    for (let i = 0; i < n; i++) { const c = hex(cfg.colors[i]); colors.set(c, i * 3); stops[i] = cfg.stops[i] ?? i / Math.max(1, n - 1); }
    gl.uniform2f(U.uResolution, w, h); gl.uniform2f(U.uCenter, cfg.centerX, cfg.centerY);
    gl.uniform1f(U.uTime, time); gl.uniform1f(U.uSeed, cfg.seed); gl.uniform1f(U.uZoom, cfg.zoom); gl.uniform1f(U.uSwirl, cfg.swirl);
    gl.uniform1f(U.uMovement, cfg.movement); gl.uniform1f(U.uAngle, cfg.angle); gl.uniform1f(U.uDetail, cfg.detail); gl.uniform1f(U.uContrast, cfg.contrast);
    gl.uniform1f(U.uGrain, cfg.grain); gl.uniform1f(U.uGrainSize, cfg.grainSize * dpr); gl.uniform1i(U.uShape, SHAPES[cfg.shape] ?? 4); gl.uniform1i(U.uCount, n);
    gl.uniform3fv(U.uColors, colors); gl.uniform1fv(U.uStops, stops);
    gl.drawArrays(gl.TRIANGLES, 0, 3); stats.draws++; stats.frames++;
  }

  // ---- loop: um relógio em segundos, dt clampado, só quando visível e na viewport, sem frame cap ----
  function frame(now) {
    raf = 0;
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    if (!motionOff) time += dt * cfg.speed;
    const resized = resize();
    if (motionOff && !dirty && !resized) return;        // reduced motion: assentado, redesenha só em mudança
    if (gl.isContextLost()) return;
    draw(); dirty = false;
    if (visible && inView && !motionOff) raf = requestAnimationFrame(frame);
  }
  function schedule() { if (!raf && visible && inView && prog) { last = performance.now(); raf = requestAnimationFrame(frame); } }
  new IntersectionObserver((es) => { inView = es[0].isIntersecting; if (inView) schedule(); }, { rootMargin: "100% 0px" }).observe(scene);
  document.addEventListener("visibilitychange", () => { visible = !document.hidden; if (visible) schedule(); });
  window.addEventListener("resize", () => { dirty = true; schedule(); }, { passive: true });

  // ---- contexto perdido: preventDefault, rebuild no restore ----
  canvas.addEventListener("webglcontextlost", (e) => { e.preventDefault(); stats.lost++; if (raf) cancelAnimationFrame(raf); raf = 0; });
  canvas.addEventListener("webglcontextrestored", () => { stats.restored++; w = h = dpr = 0; build(); dirty = true; schedule(); });

  try { build(); } catch (e) { console.error(e); scene.classList.add("static"); return; }
  schedule();
})();
</script>
</body>
</html>
