<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/" } }</script>

<body>
<div class="scene" data-lobo-scene>

<script type="module">
// ============================================================================
// CONFIG: a fonte da verdade. Schema em ../references/config-schema.md
// Morph stateless: dois buffers (aFrom, aTo) e um progresso t; o vertex shader interpola com stagger por partícula
// e espalha (scatter) no meio do caminho com curl noise. morphTo() recalcula aFrom = posição atual (CPU, N×3) e zera t.
// Os geradores de forma são os mesmos do particle-forms (copiados na geração deste arquivo).
// ============================================================================
const PRESETS = {
  "sphere-to-knot": { from: "sphere",    to: "torusKnot", sequence: ["sphere", "torusKnot", "galaxy", "hopf"], auto: true, duration: 2.2, hold: 1.6, easing: "smooth",  scatter: 0.6, stagger: 0.35, count: 160000, size: 1.8, flow: 0.15, flowScale: 1.6, colorA: "#25B8FF", colorB: "#F72585", glow: 0.8, glowSpread: 0.1, glowCutoff: 0.22, autoRotate: true, rotateSpeed: 0.1 },
  "bloom-cycle":    { from: "lotus",     to: "coral",     sequence: ["lotus", "coral", "membrane", "neuron"],   auto: true, duration: 2.6, hold: 1.2, easing: "smooth",  scatter: 0.4, stagger: 0.5,  count: 180000, size: 1.6, flow: 0.2,  flowScale: 1.4, colorA: "#FF6B9D", colorB: "#8AE9C1", glow: 0.75, glowSpread: 0.1, glowCutoff: 0.24, autoRotate: true, rotateSpeed: 0.08 },
  "tech-rings":     { from: "gyroscope", to: "wormhole",  sequence: ["gyroscope", "wormhole", "magnetosphere", "ribbon"], auto: true, duration: 1.8, hold: 1.4, easing: "elastic", scatter: 0.3, stagger: 0.25, count: 150000, size: 1.7, flow: 0.1, flowScale: 2.0, colorA: "#C8FF5A", colorB: "#01BAEF", glow: 0.85, glowSpread: 0.09, glowCutoff: 0.22, autoRotate: true, rotateSpeed: 0.12 },
  "storm":          { from: "tornado",   to: "vortex",    sequence: ["tornado", "vortex", "cosmicWave", "lorenz"], auto: true, duration: 2.0, hold: 1.0, easing: "smooth",  scatter: 0.9, stagger: 0.6,  count: 200000, size: 1.3, flow: 0.12, flowScale: 1.2, colorA: "#FFB347", colorB: "#FFFFFF", glow: 0.6, glowSpread: 0.1, glowCutoff: 0.38, autoRotate: true, rotateSpeed: 0.15 },
  "scroll-driven":  { from: "sphere",    to: "galaxy",    sequence: ["sphere", "galaxy"], auto: false, duration: 2.0, hold: 0, easing: "smooth", scatter: 0.5, stagger: 0.3, count: 160000, size: 1.7, flow: 0.15, flowScale: 1.6, colorA: "#4361EE", colorB: "#F8F9FA", glow: 0.7, glowSpread: 0.1, glowCutoff: 0.26, autoRotate: false, rotateSpeed: 0 }
};
const CONFIG = {
  preset: "sphere-to-knot",
  from: "sphere", to: "torusKnot",   // formas (shapes.md do particle-forms)
  sequence: ["sphere", "torusKnot", "galaxy", "hopf"],   // com auto: true, cicla por aqui
  t: 0,                               // 0..1 progresso do morph (scroll-grammar escreve aqui com auto: false)
  auto: true, duration: 2.2, hold: 1.6,
  easing: "smooth",                   // smooth | elastic | linear
  scatter: 0.6,                       // 0..1 quanto as partículas voam no meio do caminho
  stagger: 0.35,                      // 0..1 atraso por partícula (0 = todas juntas)
  count: 160000, size: 1.8, flow: 0.15, flowScale: 1.6,
  colorA: "#25B8FF", colorB: "#F72585",   // A = forma de origem, B = destino; a cor cruza com o progresso
  glow: 0.8, glowSpread: 0.1, glowCutoff: 0.22,
  autoRotate: true, rotateSpeed: 0.1, seed: 11, dprMax: 1.5
};

const scene = document.querySelector("[data-lobo-scene]");
const canvas = document.getElementById("mt");
const motionOff = matchMedia("(prefers-reduced-motion: reduce)").matches;
const coarse = matchMedia("(hover: none) and (pointer: coarse)").matches;
const isBot = /bot|crawl|spider|slurp|headless|lighthouse|pagespeed/i.test(navigator.userAgent);
const stats = { frames: 0, draws: 0, links: 0, lost: 0, restored: 0, resizes: 0, tier: "", morphs: 0, t: 0 };
const cfg = Object.assign({}, CONFIG);
let dirty = true, ready = false, tRaw = 0, phase = "hold", holdLeft = 0, seqIndex = 0;
function setConfig(changes) { const ignored = []; let regen = false; for (const k in changes) { if (k in cfg) { if ((k === "from" || k === "to" || k === "count" || k === "seed") && JSON.stringify(changes[k]) !== JSON.stringify(cfg[k])) regen = true; cfg[k] = changes[k]; } else ignored.push(k); } if ("t" in changes) { tRaw = +cfg.t; phase = "manual"; } dirty = true; if (ready) { if (regen) buildBuffers(true); applyConfig(); schedule(); } return { ignored }; }
const params = new URLSearchParams(location.search);
if (params.get("preset") && PRESETS[params.get("preset")]) { cfg.preset = params.get("preset"); setConfig(PRESETS[cfg.preset]); }
if (params.get("s")) { try { setConfig(JSON.parse(atob(params.get("s").replace(/-/g, "+").replace(/_/g, "/")))); } catch (e) {} }
if (params.get("t")) { tRaw = +params.get("t"); cfg.t = tRaw; cfg.auto = false; phase = "manual"; }
function exportState() { return location.origin + location.pathname + "?s=" + btoa(JSON.stringify(cfg)).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, ""); }
function morphTo(shape) { if (!ready || !SHAPES[shape]) return false; bakeCurrentAsFrom(); cfg.from = cfg.to; cfg.to = shape; geometry.setAttribute("aTo", new THREE.BufferAttribute(SHAPES[shape](geometry.getAttribute("aTo").count, cfg.seed), 3)); tRaw = 0; phase = "morph"; stats.morphs++; dirty = true; schedule(); return true; }
function next() { const seq = cfg.sequence && cfg.sequence.length ? cfg.sequence : [cfg.from, cfg.to]; seqIndex = (seqIndex + 1) % seq.length; return morphTo(seq[seqIndex]); }
window.__lobo = { config: cfg, presets: PRESETS, stats, setConfig, exportState, morphTo, next, family: "morph-transition" };
scene.style.setProperty("--ca", cfg.colorA); scene.style.setProperty("--cb", cfg.colorB);

if (isBot) { scene.classList.add("static"); }
else { boot().catch((e) => { console.error(e); scene.classList.add("static"); }); }

// ---- geradores de forma + ruído: cópia literal do particle-forms (mantenha em sincronia) ----
function rng(seed) { let a = seed >>> 0; return () => { a += 0x6D2B79F5; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const gauss = (r) => { const u = 1 - r(), v = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(6.28318 * v); };
const SHAPES = {
  torusKnot(N, seed) { const r0 = rng(seed), o = new Float32Array(N * 3), p = 2, q = 3, R = 0.78, r = 0.33, tube = 0.07;
    for (let i = 0; i < N; i++) { const t = r0() * 6.28318, s = r0() * 6.28318, k = tube * Math.sqrt(r0()); const cx = (R + r * Math.cos(q * t)) * Math.cos(p * t), cy = (R + r * Math.cos(q * t)) * Math.sin(p * t), cz = r * Math.sin(q * t); o.set([cx + k * Math.cos(s), cy + k * Math.sin(s), cz + k * Math.sin(s) * 0.7], i * 3); } return o; },
  hopf(N, seed) { const r0 = rng(seed), o = new Float32Array(N * 3), rings = 7, scale = 0.55;
    for (let i = 0; i < N; i++) { const ring = Math.floor(r0() * rings), eta = ((ring + 0.5) / rings) * 1.5708 * 0.92 + 0.04, xi1 = r0() * 6.28318, xi2 = r0() * 6.28318;
      const x1 = Math.cos(eta) * Math.cos(xi1), x2 = Math.cos(eta) * Math.sin(xi1), x3 = Math.sin(eta) * Math.cos(xi2), x4 = Math.sin(eta) * Math.sin(xi2), d = 1 / (1.05 - x4 * 0.6);
      o.set([x1 * d * scale, x2 * d * scale, x3 * d * scale], i * 3); } return o; },
  lotus(N, seed) { const r0 = rng(seed), o = new Float32Array(N * 3), petals = 6;
    for (let i = 0; i < N; i++) { const a = r0() * 6.28318, u = Math.sqrt(r0()), rad = Math.abs(Math.cos(petals * a * 0.5)) * 1.2 * u + 0.05; o.set([rad * Math.cos(a), rad * Math.sin(a), 0.6 * u * u * (0.5 + 0.5 * Math.cos(petals * a)) - 0.2], i * 3); } return o; },
  galaxy(N, seed) { const r0 = rng(seed), o = new Float32Array(N * 3), arms = 3, twist = 2.4;
    for (let i = 0; i < N; i++) { if (r0() < 0.15) { const g = gauss(r0) * 0.12, a = r0() * 6.28318; o.set([g * Math.cos(a), g * Math.sin(a), gauss(r0) * 0.08], i * 3); continue; }
      const arm = Math.floor(r0() * arms), d = Math.pow(r0(), 0.7) * 1.4, a = (arm / arms) * 6.28318 + d * twist + gauss(r0) * 0.12 * (0.3 + d);
      o.set([d * Math.cos(a) + gauss(r0) * 0.03, d * Math.sin(a) + gauss(r0) * 0.03, gauss(r0) * 0.03 / (0.3 + d)], i * 3); } return o; },
  sphere(N, seed) { const r0 = rng(seed), o = new Float32Array(N * 3); for (let i = 0; i < N; i++) { const z = r0() * 2 - 1, a = r0() * 6.28318, rr = Math.sqrt(1 - z * z), k = 1 + (r0() - 0.5) * 0.1; o.set([rr * Math.cos(a) * k, rr * Math.sin(a) * k, z * k], i * 3); } return o; },
  lorenz: (N, seed) => integrate(N, seed, (x, y, z, dt) => [x + 10 * (y - x) * dt, y + (x * (28 - z) - y) * dt, z + (x * y - 2.6667 * z) * dt], { dt: 0.004, scale: [0.045, 0.045, 0.04], zOff: -1.0, start: (r) => [r() * 2 - 1, r() * 2 - 1, 20 + r() * 10] }),
  aizawa: (N, seed) => integrate(N, seed, (x, y, z, dt) => [x + ((z - 0.7) * x - 3.5 * y) * dt, y + (3.5 * x + (z - 0.7) * y) * dt, z + (0.6 + 0.95 * z - z * z * z / 3 - (x * x + y * y) * (1 + 0.25 * z) + 0.1 * z * x * x * x) * dt], { dt: 0.01, scale: [0.6, 0.6, 0.6], zOff: 0, start: (r) => [0.1 + r() * 0.1, r() * 0.1, r() * 0.1] }),
  membrane(N, seed) { const r0 = rng(seed), o = new Float32Array(N * 3); for (let i = 0; i < N; i++) { const x = (r0() * 2 - 1) * 1.35, y = (r0() * 2 - 1) * 0.85, z = 0.22 * Math.sin(x * 3.1 + seed * 0.1) * Math.cos(y * 3.4) + 0.08 * Math.sin(x * 7.0 + y * 5.0) + (r0() - 0.5) * 0.02; o.set([x, y, z], i * 3); } return o; },
  coral(N, seed) { const r0 = rng(seed), o = new Float32Array(N * 3), B = 36; for (let i = 0; i < N; i++) { const b = Math.floor(r0() * B), t = Math.pow(r0(), 0.8), a = b * 2.399 + seed, bx = Math.cos(a) * 0.35, bz = Math.sin(a) * 0.35; const x = bx * (1 + t * 1.6) + 0.35 * Math.sin(t * 4.0 + b) * t, y = -0.95 + 1.8 * t + 0.1 * Math.sin(b * 3.0), z = bz * (1 + t * 1.6) + 0.35 * Math.cos(t * 3.3 + b * 2.0) * t, j = 0.015 + 0.05 * (1 - t); o.set([x + gauss(r0) * j, y + gauss(r0) * j, z + gauss(r0) * j], i * 3); } return o; },
  neuron(N, seed) { const r0 = rng(seed), o = new Float32Array(N * 3), D = 14, dirs = []; for (let k = 0; k < D; k++) { const z = r0() * 2 - 1, a = r0() * 6.28318, rr = Math.sqrt(1 - z * z); dirs.push([rr * Math.cos(a), rr * Math.sin(a), z]); }
    for (let i = 0; i < N; i++) { if (r0() < 0.22) { const z = r0() * 2 - 1, a = r0() * 6.28318, rr = Math.sqrt(1 - z * z), k = 0.26 * Math.cbrt(r0()); o.set([rr * Math.cos(a) * k, rr * Math.sin(a) * k, z * k], i * 3); continue; }
      const k = Math.floor(r0() * D), d = dirs[k], t = 0.22 + r0() * 0.95, w = 0.12 * Math.sin(t * 9.0 + k) * t, branch = t > 0.6 ? 0.25 * (t - 0.6) * (k % 2 ? 1 : -1) : 0, j = 0.012 + 0.02 * t;
      o.set([d[0] * t + w * d[1] + branch * d[2] + gauss(r0) * j, d[1] * t - w * d[0] + gauss(r0) * j, d[2] * t + w * 0.5 + branch * d[0] + gauss(r0) * j], i * 3); } return o; },
  tornado(N, seed) { const r0 = rng(seed), o = new Float32Array(N * 3); for (let i = 0; i < N; i++) { const t = Math.pow(r0(), 0.6), r = (0.1 + 1.0 * t * t) * (0.85 + 0.3 * r0()), a = t * 22.0 + r0() * 0.7 + seed; o.set([Math.cos(a) * r, -0.95 + 1.9 * t, Math.sin(a) * r], i * 3); } return o; },
  gyroscope(N, seed) { const r0 = rng(seed), o = new Float32Array(N * 3); for (let i = 0; i < N; i++) { const k = Math.floor(r0() * 4), a = r0() * 6.28318, R = k === 3 ? 0.55 : 1.0, tube = 0.045 * Math.sqrt(r0()), s = r0() * 6.28318, c = Math.cos(a) * R, sn = Math.sin(a) * R, tx = Math.cos(s) * tube, ty = Math.sin(s) * tube;
      const p = k === 0 ? [c + tx, sn + ty, ty] : k === 1 ? [tx, c + ty, sn + tx] : k === 2 ? [c + ty, tx, sn + tx] : [c * 0.7 + sn * 0.7 + tx, sn * 0.7 - c * 0.7 + ty, tx]; o.set(p, i * 3); } return o; },
  wormhole(N, seed) { const r0 = rng(seed), o = new Float32Array(N * 3), ct = Math.cos(0.55), st = Math.sin(0.55); for (let i = 0; i < N; i++) { const u = (r0() * 2 - 1) * 1.5, r = (0.22 + 0.5 * u * u) * (0.92 + 0.16 * r0()), a = r0() * 6.28318 + u * 2.2 + seed, x = Math.cos(a) * r, y = u * 0.85, z = Math.sin(a) * r; o.set([x, y * ct - z * st, y * st + z * ct], i * 3); } return o; },
  ribbon(N, seed) { const r0 = rng(seed), o = new Float32Array(N * 3); for (let i = 0; i < N; i++) { const t = r0(), w = (r0() - 0.5) * 0.5, tw = t * 12.566 + seed, x = (t - 0.5) * 2.6, y = w * Math.cos(tw) + 0.3 * Math.sin(t * 6.28), z = w * Math.sin(tw); o.set([x + gauss(r0) * 0.008, y + gauss(r0) * 0.008, z + gauss(r0) * 0.008], i * 3); } return o; },
  vortex(N, seed) { const r0 = rng(seed), o = new Float32Array(N * 3), ct = Math.cos(-0.95), st = Math.sin(-0.95); for (let i = 0; i < N; i++) { const r = 0.08 + 1.2 * Math.pow(r0(), 0.6), k = Math.floor(r0() * 3), a = k * 2.0944 + (r0() - 0.5) * 0.7 + 1.6 / r + r * 2.5 + seed, y = 0.9 * (r / 1.28) - 0.5 + gauss(r0) * 0.03, x = Math.cos(a) * r, z = Math.sin(a) * r; o.set([x, y * ct - z * st, y * st + z * ct], i * 3); } return o; },
  cosmicWave(N, seed) { const r0 = rng(seed), o = new Float32Array(N * 3), rows = 11; for (let i = 0; i < N; i++) { const k = Math.floor(r0() * rows), x = (r0() * 2 - 1) * 1.4, y = -0.8 + k * 0.16 + gauss(r0) * 0.012, z = 0.35 * Math.sin(x * 2.5 + k * 0.7 + seed * 0.1) * Math.cos(k * 0.6) + gauss(r0) * 0.01; o.set([x, y, z], i * 3); } return o; },
  magnetosphere(N, seed) { const r0 = rng(seed), o = new Float32Array(N * 3), lines = 40; for (let i = 0; i < N; i++) { const k = Math.floor(r0() * lines), L = 0.35 + 1.0 * Math.pow((k % 10) / 9, 1.4), phi = (k / lines) * 6.28318 + seed, th = 0.42 + r0() * (3.1416 - 0.84), r = L * Math.sin(th) * Math.sin(th), j = 0.012; o.set([r * Math.sin(th) * Math.cos(phi) + gauss(r0) * j, r * Math.cos(th) + gauss(r0) * j, r * Math.sin(th) * Math.sin(phi) + gauss(r0) * j], i * 3); } return o; },
  thomas: (N, seed) => integrate(N, seed, (x, y, z, dt) => [x + (Math.sin(y) - 0.208186 * x) * dt, y + (Math.sin(z) - 0.208186 * y) * dt, z + (Math.sin(x) - 0.208186 * z) * dt], { dt: 0.05, scale: [0.25, 0.25, 0.25], zOff: 0, start: (r) => [r() * 2 - 1, r() * 2 - 1, r() * 2 - 1] })

function integrate(N, seed, f, { dt, scale, zOff, start, burn = 2000, stride = 2, trails = 24 }) {
  const r0 = rng(seed), o = new Float32Array(N * 3), per = Math.ceil(N / trails); let k = 0;

    for (let i = 0; i < per && k < N; i++) { for (let s = 0; s < stride; s++) [x, y, z] = f(x, y, z, dt); o.set([x * scale[0], y * scale[1], z * scale[2] + zOff], k * 3); k++; } }
  return o;
}

// ---------------------------------------------------------------------------
// Shaders: curl noise (Ashima simplex 3D) no vertex, disco suave aditivo no fragment
// ---------------------------------------------------------------------------
const NOISE = `
vec4 mod289(vec4 x){ return x - floor(x * (1.0 / 289.0)) * 289.0; } vec3 mod289(vec3 x){ return x - floor(x * (1.0 / 289.0)) * 289.0; }
vec4 permute(vec4 x){ return mod289(((x * 34.0) + 1.0) * x); } vec4 taylorInvSqrt(vec4 r){ return 1.79284291400159 - 0.85373472095314 * r; }
float snoise(vec3 v){ const vec2 C = vec2(1.0 / 6.0, 1.0 / 3.0); const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);
  vec3 i = floor(v + dot(v, C.yyy)); vec3 x0 = v - i + dot(i, C.xxx); vec3 g = step(x0.yzx, x0.xyz); vec3 l = 1.0 - g; vec3 i1 = min(g.xyz, l.zxy); vec3 i2 = max(g.xyz, l.zxy);
  vec3 x1 = x0 - i1 + C.xxx; vec3 x2 = x0 - i2 + C.yyy; vec3 x3 = x0 - D.yyy; i = mod289(i);
  vec4 p = permute(permute(permute(i.z + vec4(0.0, i1.z, i2.z, 1.0)) + i.y + vec4(0.0, i1.y, i2.y, 1.0)) + i.x + vec4(0.0, i1.x, i2.x, 1.0));
  float n_ = 0.142857142857; vec3 ns = n_ * D.wyz - D.xzx; vec4 j = p - 49.0 * floor(p * ns.z * ns.z); vec4 x_ = floor(j * ns.z); vec4 y_ = floor(j - 7.0 * x_);
  vec4 x = x_ * ns.x + ns.yyyy; vec4 y = y_ * ns.x + ns.yyyy; vec4 h = 1.0 - abs(x) - abs(y); vec4 b0 = vec4(x.xy, y.xy); vec4 b1 = vec4(x.zw, y.zw);
  vec4 s0 = floor(b0) * 2.0 + 1.0; vec4 s1 = floor(b1) * 2.0 + 1.0; vec4 sh = -step(h, vec4(0.0)); vec4 a0 = b0.xzyw + s0.xzyw * sh.xxyy; vec4 a1 = b1.xzyw + s1.xzyw * sh.zzww;
  vec3 p0 = vec3(a0.xy, h.x); vec3 p1 = vec3(a0.zw, h.y); vec3 p2 = vec3(a1.xy, h.z); vec3 p3 = vec3(a1.zw, h.w);
  vec4 norm = taylorInvSqrt(vec4(dot(p0, p0), dot(p1, p1), dot(p2, p2), dot(p3, p3))); p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
  vec4 m = max(0.6 - vec4(dot(x0, x0), dot(x1, x1), dot(x2, x2), dot(x3, x3)), 0.0); m = m * m; return 42.0 * dot(m * m, vec4(dot(p0, x0), dot(p1, x1), dot(p2, x2), dot(p3, x3))); }
vec3 pot(vec3 p){ return vec3(snoise(p), snoise(p + vec3(31.416)), snoise(p - vec3(47.853))); }
vec3 curlNoise(vec3 p){ const float e = 0.1; vec3 dx = vec3(e, 0.0, 0.0), dy = vec3(0.0, e, 0.0), dz = vec3(0.0, 0.0, e);
  vec3 px0 = pot(p - dx), px1 = pot(p + dx), py0 = pot(p - dy), py1 = pot(p + dy), pz0 = pot(p - dz), pz1 = pot(p + dz);
  return vec3((py1.z - py0.z) - (pz1.y - pz0.y), (pz1.x - pz0.x) - (px1.z - px0.z), (px1.y - px0.y) - (py1.x - py0.x)) / (2.0 * e); }`;

const VERT = NOISE + `
uniform float uTime, uT, uScatter, uStagger, uFlow, uFlowScale, uSize, uPixelScale;
attribute vec3 aTo; attribute float aRandom; varying float vMix, vFade, vProg;
void main(){
  // progresso por partícula: as de aRandom baixo partem antes (stagger)
  float d = aRandom * uStagger; float tp = clamp((uT - d) / max(1.0 - d, 0.001), 0.0, 1.0);
