<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Post Image FX · Lobo Motion</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; }
  .scene { position: relative; width: 100%; height: 100lvh; overflow: hidden; transform: translateZ(0); background: var(--paper, #000); }
  .scene canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .drop { position: absolute; left: 16px; bottom: 16px; font: 12px/1.3 ui-monospace, monospace; color: rgba(255,255,255,.55); background: rgba(0,0,0,.35); padding: 6px 10px; border-radius: 6px; pointer-events: none; }
  .scene.over { outline: 2px dashed rgba(255,255,255,.6); outline-offset: -8px; }
  .scene.static canvas, .scene.static .drop { display: none; }
  .scene.static .fallback { display: block; }
  .fallback { display: none; position: absolute; inset: 0; background: repeating-linear-gradient(0deg, #000 0 2px, #0a0a0a 2px 4px); }
  input[type=file] { position: absolute; width: 1px; height: 1px; opacity: 0; }
</style>
</head>
<body>
<div class="scene" data-lobo-scene>
  <canvas id="fx" aria-hidden="true"></canvas>
  <div class="fallback" aria-hidden="true"></div>
  <div class="drop">solte uma imagem ou vídeo aqui · modo: <span id="modeLabel">ascii</span></div>
  <input id="file" type="file" accept="image/*,video/*" aria-label="Imagem ou vídeo">
</div>

    gl.uniform1f(U.uCurve, R.curve); gl.uniform1f(U.uDepth, R.depth); gl.uniform1f(U.uAngle, R.angle); gl.uniform1f(U.uDisp, R.dispersion); gl.uniform1f(U.uSheen, R.sheen); gl.uniform1f(U.uParallax, R.parallax); gl.uniform1f(U.uCell, (cfg.mode === "refract" ? R.cellSize : A.cellSize) * dpr);

    gl.bindFramebuffer(gl.FRAMEBUFFER, fbo[ping]); gl.drawArrays(gl.TRIANGLES, 0, 3); gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.drawArrays(gl.TRIANGLES, 0, 3); stats.draws += 2; stats.frames++; ping = 1 - ping;

})();
