<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Image Reveal · Lobo Motion</title>
<style>
  html, body { margin: 0; height: 100%; background: #0a0a0c; }
  .scene { position: relative; width: 100%; height: 100lvh; overflow: hidden; background: #0a0a0c; transform: translateZ(0); }
  .scene canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  /* Robot form e fallback: a própria imagem em <img>, sem WebGL (SEO e preview). */
  .fallback { position: absolute; inset: 0; display: none; }
  .fallback img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .scene.static .fallback { display: block; }
  .scene.static canvas { display: none; }
</style>
</head>
<body>
<div class="scene" data-lobo-scene>
  <canvas id="ir" aria-hidden="true"></canvas>
  <div class="fallback"><img id="fb" alt="" decoding="async"></div>
</div>
<script>
// ============================================================================
// CONFIG: a fonte da verdade. Schema em ../references/config-schema.md
// Um fragment shader sobre uma textura: reveal (0..1) + hover (ponteiro) por modo.
// ============================================================================
const PRESETS = {
  "liquid-reveal": { mode: "liquid", reveal: 0, autoReveal: true, duration: 1.6, hover: 0.5, hoverRadius: 0.22, noiseScale: 2.2, pixelSize: 0, tiles: 0, direction: 90, edge: 0.08, tint: "#FFFFFF" },
  "pixel-resolve": { mode: "pixel",  reveal: 0, autoReveal: true, duration: 1.4, hover: 0.0, hoverRadius: 0.2,  noiseScale: 1.0, pixelSize: 64, tiles: 0, direction: 0, edge: 0.1, tint: "#FFFFFF" },
  "tiles-flip":    { mode: "tiles",  reveal: 0, autoReveal: true, duration: 1.8, hover: 0.3, hoverRadius: 0.2,  noiseScale: 1.0, pixelSize: 0, tiles: 10, direction: 45, edge: 0.15, tint: "#FFFFFF" },
  "wipe-warp":     { mode: "wipe",   reveal: 0, autoReveal: true, duration: 1.3, hover: 0.6, hoverRadius: 0.25, noiseScale: 3.0, pixelSize: 0, tiles: 0, direction: 20, edge: 0.12, tint: "#FFFFFF" },
  "hover-ripple":  { mode: "ripple", reveal: 1, autoReveal: false, duration: 1.0, hover: 1.0, hoverRadius: 0.3, noiseScale: 1.0, pixelSize: 0, tiles: 0, direction: 0, edge: 0.1, tint: "#FFFFFF" },
  "hover-liquid":  { mode: "displace", reveal: 1, autoReveal: false, duration: 1.0, hover: 0.9, hoverRadius: 0.28, noiseScale: 2.5, pixelSize: 0, tiles: 0, direction: 0, edge: 0.1, tint: "#FFFFFF" }
};
const CONFIG = {
  preset: "liquid-reveal",
  src: "",                 // URL da imagem; vazio = imagem procedural de amostra
  mode: "liquid",          // liquid | pixel | tiles | wipe | ripple | displace
  reveal: 0,               // 0..1 progresso do reveal (scroll-grammar escreve aqui)
  autoReveal: true,        // anima reveal 0→1 ao entrar na viewport
  duration: 1.6,           // s
  hover: 0.5,              // 0..1 força do efeito do ponteiro
  hoverRadius: 0.22,       // em fração da largura
  noiseScale: 2.2,         // frequência do ruído (liquid, wipe, displace)
  pixelSize: 0,            // px do mosaico inicial (pixel); 0 = off
  tiles: 0,                // colunas de tiles (tiles)
  direction: 90,           // graus (wipe, tiles)
  edge: 0.08,              // largura da borda do reveal
  tint: "#FFFFFF",         // multiplica a imagem (branco = sem tint)
  speed: 1, seed: 3, dprMax: 1.5
};

(function () {
  const scene = document.querySelector("[data-lobo-scene]");
  const canvas = document.getElementById("ir");
  const fbImg = document.getElementById("fb");
  const motionOff = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const coarse = matchMedia("(hover: none) and (pointer: coarse)").matches;
  const isBot = /bot|crawl|spider|slurp|headless|lighthouse|pagespeed/i.test(navigator.userAgent);
  const stats = { frames: 0, draws: 0, links: 0, lost: 0, restored: 0, resizes: 0, reveal: 0 };
  let gl = null, prog = null, U = {}, tex = null, raf = 0, last = performance.now(), time = 0, dirty = true, visible = !document.hidden, inView = true, w = 0, h = 0, dpr = 0, imgW = 1, imgH = 1, revealT = 0, animating = false;
  const pointer = { x: 0.5, y: 0.5, tx: 0.5, ty: 0.5, active: false, vx: 0, vy: 0, lastT: 0 };

  const cfg = Object.assign({}, CONFIG);
  const params = new URLSearchParams(location.search);
  function setConfig(changes) { const ignored = []; let reload = false; for (const k in changes) { if (k in cfg) { if (k === "src" && changes[k] !== cfg[k]) reload = true; cfg[k] = changes[k]; } else ignored.push(k); } if ("reveal" in changes) { revealT = +cfg.reveal; animating = false; } dirty = true; if (reload && gl) loadImage(); schedule(); return { ignored }; }
  if (params.get("preset") && PRESETS[params.get("preset")]) { cfg.preset = params.get("preset"); setConfig(PRESETS[cfg.preset]); }
  if (params.get("src")) cfg.src = params.get("src");
  if (params.get("s")) { try { setConfig(JSON.parse(atob(params.get("s").replace(/-/g, "+").replace(/_/g, "/")))); } catch (e) {} }
  function exportState() { return location.origin + location.pathname + "?s=" + btoa(JSON.stringify(cfg)).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, ""); }
  function play() { revealT = 0; animating = true; dirty = true; schedule(); }
  function replay() { play(); }
  window.__lobo = { config: cfg, presets: PRESETS, stats, setConfig, exportState, play, replay, family: "image-reveal" };

  // ---- imagem de amostra procedural (quando não há src): gradiente, formas e um glifo ----
  function sampleImage() {
    const c = document.createElement("canvas"); c.width = 1280; c.height = 800; const x = c.getContext("2d");
    const g = x.createLinearGradient(0, 0, 1280, 800); g.addColorStop(0, "#1b1230"); g.addColorStop(0.5, "#3a0ca3"); g.addColorStop(1, "#f72585"); x.fillStyle = g; x.fillRect(0, 0, 1280, 800);
    for (let i = 0; i < 9; i++) { const r = 60 + i * 38, px = 220 + i * 110, py = 420 + Math.sin(i * 1.3) * 160; const rg = x.createRadialGradient(px, py, 0, px, py, r); rg.addColorStop(0, `hsla(${30 + i * 26},95%,65%,0.9)`); rg.addColorStop(1, "hsla(0,0%,0%,0)"); x.fillStyle = rg; x.beginPath(); x.arc(px, py, r, 0, 6.2832); x.fill(); }
    x.fillStyle = "rgba(255,255,255,0.92)"; x.font = "700 180px system-ui, sans-serif"; x.textAlign = "center"; x.textBaseline = "middle"; x.fillText("LOBO", 640, 400);
    x.strokeStyle = "rgba(255,255,255,0.35)"; x.lineWidth = 3; for (let i = 0; i < 12; i++) { x.beginPath(); x.moveTo(0, 60 + i * 64); x.lineTo(1280, 90 + i * 64 + Math.sin(i) * 30); x.stroke(); }
    return c;
  }
  function loadImage() {
    const done = (source, sw, sh) => { imgW = sw; imgH = sh; if (!gl) return; gl.bindTexture(gl.TEXTURE_2D, tex); gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true); gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, source); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE); dirty = true; if (cfg.autoReveal && !motionOff) play(); else { revealT = motionOff ? 1 : +cfg.reveal; schedule(); } };
    if (cfg.src) { const im = new Image(); im.crossOrigin = "anonymous"; im.onload = () => done(im, im.naturalWidth, im.naturalHeight); im.onerror = () => { const c = sampleImage(); done(c, c.width, c.height); }; im.src = cfg.src; fbImg.src = cfg.src; }
    else { const c = sampleImage(); fbImg.src = c.toDataURL("image/jpeg", 0.8); done(c, c.width, c.height); }
  }

  if (isBot) { scene.classList.add("static"); if (cfg.src) fbImg.src = cfg.src; else fbImg.src = sampleImage().toDataURL("image/jpeg", 0.8); return; }
  gl = canvas.getContext("webgl2", { alpha: false, antialias: false, depth: false, stencil: false, powerPreference: coarse ? "default" : "high-performance" });
  if (!gl) { scene.classList.add("static"); loadImage(); return; }

  const VERT = `#version 300 es
  out vec2 vUv; void main(){ vec2 p = vec2((gl_VertexID << 1) & 2, gl_VertexID & 2); vUv = p; gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0); }`;
  const FRAG = `#version 300 es
  precision highp float; in vec2 vUv; out vec4 fragColor;
  uniform sampler2D uTex; uniform vec2 uResolution, uScale, uOffset, uPointer, uPointerVel; uniform float uTime, uReveal, uHover, uHoverRadius, uNoiseScale, uPixel, uTiles, uDir, uEdge, uSeed, uAspect; uniform int uMode; uniform vec3 uTint;
  vec3 mod289(vec3 x){ return x - floor(x * (1.0 / 289.0)) * 289.0; } vec2 mod289(vec2 x){ return x - floor(x * (1.0 / 289.0)) * 289.0; } vec3 permute(vec3 x){ return mod289(((x * 34.0) + 1.0) * x); }
  float snoise(vec2 v){ const vec4 C = vec4(0.211324865405187, 0.366025403784439, -0.577350269189626, 0.024390243902439); vec2 i = floor(v + dot(v, C.yy)); vec2 x0 = v - i + dot(i, C.xx); vec2 i1 = (x0.x > x0.y) ? vec2(1.0, 0.0) : vec2(0.0, 1.0); vec4 x12 = x0.xyxy + C.xxzz; x12.xy -= i1; i = mod289(i); vec3 p = permute(permute(i.y + vec3(0.0, i1.y, 1.0)) + i.x + vec3(0.0, i1.x, 1.0)); vec3 m = max(0.5 - vec3(dot(x0, x0), dot(x12.xy, x12.xy), dot(x12.zw, x12.zw)), 0.0); m = m * m; m = m * m; vec3 x = 2.0 * fract(p * C.www) - 1.0; vec3 h = abs(x) - 0.5; vec3 ox = floor(x + 0.5); vec3 a0 = x - ox; m *= 1.79284291400159 - 0.85373472095314 * (a0 * a0 + h * h); vec3 g; g.x = a0.x * x0.x + h.x * x0.y; g.yz = a0.yz * x12.xz + h.yz * x12.yw; return 130.0 * dot(m, g); }
  float fbm(vec2 p){ float v = 0.0, a = 0.5; for (int i = 0; i < 4; i++){ v += a * snoise(p); p = p * 2.03 + 11.7; a *= 0.5; } return v * 0.5 + 0.5; }
  float hash21(vec2 p){ p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
  vec2 cover(vec2 uv){ return (uv - 0.5) * uScale + 0.5 + uOffset; }
  void main(){
    vec2 uv = vUv; vec2 ar = vec2(uAspect, 1.0);
    vec2 d = (uv - uPointer) * ar; float pd = length(d);
    float hov = uHover * smoothstep(uHoverRadius, 0.0, pd);
    float r = clamp(uReveal, 0.0, 1.0), edge = max(uEdge, 0.005);
    float dirR = radians(uDir); vec2 dv = vec2(cos(dirR), sin(dirR));
    float along = dot((uv - 0.5) * ar, dv) / (abs(dv.x) * uAspect + abs(dv.y)) + 0.5;   // 0..1 ao longo da direção
    vec2 suv = uv; float mask = 1.0; vec3 col;
    if (uMode == 0) {        // liquid: ruído como limiar, borda queimada
      float n = fbm(uv * ar * uNoiseScale + uSeed); float t = r * (1.0 + edge * 2.0) - edge; mask = 1.0 - smoothstep(t, t + edge, n * 0.9 + 0.05);
      suv += (fbm(uv * ar * uNoiseScale * 1.7 + uTime * 0.2) - 0.5) * (1.0 - r) * 0.08 + d * hov * 0.15;
    } else if (uMode == 1) { // pixel: mosaico que resolve
      float px = max(1.0, uPixel * (1.0 - r) * (1.0 - r)); vec2 cell = uResolution / px; suv = (floor(uv * cell) + 0.5) / cell; if (px <= 1.5) suv = uv; mask = smoothstep(0.0, 0.25, r);
    } else if (uMode == 2) { // tiles: grade que vira por ordem na direção
      float cols = max(2.0, uTiles), rows = floor(cols / uAspect + 0.5); vec2 id = floor(uv * vec2(cols, rows)); vec2 c = (id + 0.5) / vec2(cols, rows);
      float order = dot((c - 0.5) * ar, dv) / (abs(dv.x) * uAspect + abs(dv.y)) + 0.5; float h = hash21(id + uSeed);
      float tt = clamp((r * 1.5 - order - h * 0.25) / 0.45, 0.0, 1.0); vec2 local = fract(uv * vec2(cols, rows)) - 0.5; float sc = mix(0.0, 1.0, smoothstep(0.0, 1.0, tt));
      mask = step(abs(local.x), sc * 0.5) * step(abs(local.y), sc * 0.5) * step(0.001, sc); suv = uv + d * hov * 0.1;
    } else if (uMode == 3) { // wipe: varredura com borda deformada por ruído
      float n = (fbm(uv * ar * uNoiseScale + uSeed) - 0.5) * 0.35; float t = r * (1.0 + edge * 2.0 + 0.3) - edge - 0.15; mask = 1.0 - smoothstep(t, t + edge, along + n); suv += d * hov * 0.12 + (1.0 - r) * dv * 0.05 * (1.0 - mask);
    } else if (uMode == 4) { // ripple: ondas a partir do ponteiro
      float rip = sin(pd * 40.0 - uTime * 6.0) * hov * 0.012 / (pd * 3.0 + 0.4); suv += normalize(d + 1e-5) * rip; mask = 1.0;
    } else {                 // displace: líquido no hover com a velocidade do ponteiro
      float n1 = fbm(uv * ar * uNoiseScale + uTime * 0.35), n2 = fbm(uv * ar * uNoiseScale + 7.3 - uTime * 0.3);
      suv += vec2(n1 - 0.5, n2 - 0.5) * hov * 0.12 + uPointerVel * hov * 0.5 * smoothstep(uHoverRadius, 0.0, pd); mask = 1.0;
    }
    vec2 tuv = cover(suv); vec3 img = texture(uTex, clamp(tuv, 0.001, 0.999)).rgb;
    if (uMode == 0 || uMode == 3) { float glow = smoothstep(0.0, 1.0, mask) * (1.0 - smoothstep(0.0, 1.0, mask - 0.35)); img += uTint * glow * 0.35 * (1.0 - r); }
    col = img * uTint * mask;
    fragColor = vec4(col, 1.0);
  }`;
  function compile(type, src) { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; }
  function build() {
    prog = gl.createProgram(); gl.attachShader(prog, compile(gl.VERTEX_SHADER, VERT)); gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FRAG)); gl.linkProgram(prog); stats.links++;
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
    gl.useProgram(prog); U = {};
    for (const n of ["uTex", "uResolution", "uScale", "uOffset", "uPointer", "uPointerVel", "uTime", "uReveal", "uHover", "uHoverRadius", "uNoiseScale", "uPixel", "uTiles", "uDir", "uEdge", "uSeed", "uAspect", "uMode", "uTint"]) U[n] = gl.getUniformLocation(prog, n);
    tex = tex || gl.createTexture(); gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, tex); gl.uniform1i(U.uTex, 0);
  }
  const MODES = { liquid: 0, pixel: 1, tiles: 2, wipe: 3, ripple: 4, displace: 5 };
  const hex = (h) => { const n = parseInt(h.replace("#", ""), 16); return [((n >> 16) & 255) / 255, ((n >> 8) & 255) / 255, (n & 255) / 255]; };
  function resize() {
    const r = scene.getBoundingClientRect(), d = Math.min(cfg.dprMax, coarse ? 1.25 : 1.5, window.devicePixelRatio || 1);
    const nw = Math.max(1, Math.round(r.width * d)), nh = Math.max(1, Math.round(r.height * d));
    if (nw === w && nh === h && d === dpr) return false;
    w = nw; h = nh; dpr = d; canvas.width = w; canvas.height = h; gl.viewport(0, 0, w, h); stats.resizes++; return true;
  }
  function draw() {
    // object-fit: cover em uv
    const ca = w / h, ia = imgW / imgH; let sx = 1, sy = 1; if (ca > ia) sy = ia / ca; else sx = ca / ia;
    gl.uniform2f(U.uResolution, w, h); gl.uniform2f(U.uScale, sx, sy); gl.uniform2f(U.uOffset, 0, 0); gl.uniform1f(U.uAspect, ca);
    gl.uniform2f(U.uPointer, pointer.x, 1 - pointer.y); gl.uniform2f(U.uPointerVel, pointer.vx, -pointer.vy);
    gl.uniform1f(U.uTime, time); gl.uniform1f(U.uReveal, revealT); gl.uniform1f(U.uHover, coarse ? 0 : cfg.hover); gl.uniform1f(U.uHoverRadius, cfg.hoverRadius);
    gl.uniform1f(U.uNoiseScale, cfg.noiseScale); gl.uniform1f(U.uPixel, cfg.pixelSize * dpr); gl.uniform1f(U.uTiles, cfg.tiles); gl.uniform1f(U.uDir, cfg.direction); gl.uniform1f(U.uEdge, cfg.edge); gl.uniform1f(U.uSeed, cfg.seed);
    gl.uniform1i(U.uMode, MODES[cfg.mode] ?? 0); const t = hex(cfg.tint); gl.uniform3f(U.uTint, t[0], t[1], t[2]);
    gl.drawArrays(gl.TRIANGLES, 0, 3); stats.draws++; stats.frames++; stats.reveal = +revealT.toFixed(3);
  }
  const ease = (x) => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
  let revealRaw = 0;
  function frame(now) {
    raf = 0;
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    if (!motionOff) time += dt * cfg.speed;
    if (animating) { revealRaw = Math.min(1, revealRaw + dt / Math.max(0.1, cfg.duration)); revealT = ease(revealRaw); if (revealRaw >= 1) { animating = false; cfg.reveal = 1; } }
    const k = 1 - Math.pow(1 - 0.2, dt * 60); const px = pointer.x, py = pointer.y;
    pointer.x += (pointer.tx - pointer.x) * k; pointer.y += (pointer.ty - pointer.y) * k; pointer.vx = (pointer.x - px) / Math.max(dt, 1e-3) * 0.05; pointer.vy = (pointer.y - py) / Math.max(dt, 1e-3) * 0.05;
    const moving = Math.hypot(pointer.tx - pointer.x, pointer.ty - pointer.y) > 0.0005 || Math.hypot(pointer.vx, pointer.vy) > 0.001;
    const needsTime = (cfg.mode === "ripple" || cfg.mode === "displace" || cfg.mode === "liquid") && pointer.active;
    const resized = resize();
    if (motionOff && !dirty && !resized && !animating) return;
    if (gl.isContextLost()) return;
    draw(); dirty = false;
    if (visible && inView && (animating || (!motionOff && (needsTime || moving || revealT < 1)))) raf = requestAnimationFrame(frame);
  }
  function schedule() { if (!raf && visible && inView && prog) { last = performance.now(); raf = requestAnimationFrame(frame); } }
  new IntersectionObserver((es) => { inView = es[0].isIntersecting; if (inView) { if (cfg.autoReveal && revealT === 0 && !animating && !motionOff) play(); schedule(); } }, { rootMargin: "0px 0px -20% 0px" }).observe(scene);
  document.addEventListener("visibilitychange", () => { visible = !document.hidden; if (visible) schedule(); });
  window.addEventListener("resize", () => { dirty = true; schedule(); }, { passive: true });
  if (!coarse) {
    window.addEventListener("pointermove", (e) => { const r = scene.getBoundingClientRect(); pointer.tx = (e.clientX - r.left) / r.width; pointer.ty = (e.clientY - r.top) / r.height; if (!pointer.active) { pointer.x = pointer.tx; pointer.y = pointer.ty; } pointer.active = true; schedule(); }, { passive: true });
    scene.addEventListener("pointerleave", () => { pointer.active = false; });
    scene.addEventListener("click", () => { if (cfg.mode !== "ripple" && cfg.mode !== "displace") replay(); });
  }
  canvas.addEventListener("webglcontextlost", (e) => { e.preventDefault(); stats.lost++; if (raf) cancelAnimationFrame(raf); raf = 0; });
  canvas.addEventListener("webglcontextrestored", () => { stats.restored++; w = h = dpr = 0; tex = null; build(); loadImage(); dirty = true; schedule(); });
  try { build(); } catch (e) { console.error(e); scene.classList.add("static"); loadImage(); return; }
  if (motionOff) revealT = 1;
  loadImage();
  resize(); draw();   // pré-aquece: compila antes do primeiro frame visível
  schedule();
})();
</script>
</body>
</html>
