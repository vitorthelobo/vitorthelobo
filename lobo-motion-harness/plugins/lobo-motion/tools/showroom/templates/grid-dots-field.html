<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grid Dots Field · Lobo Motion</title>
<style>
  html, body { margin: 0; height: 100%; background: #0a0a0c; }
  .scene { position: relative; width: 100%; height: 100lvh; overflow: hidden; background: var(--bg, #0a0a0c); transform: translateZ(0); }
  .scene canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  /* Robot form e fallback: a mesma grade em CSS, sem JS. */
  .fallback { position: absolute; inset: 0; display: none; opacity: 0.55;
    background-image: radial-gradient(circle, var(--c, #ffffff) 1px, transparent 1.5px); background-size: var(--sp, 28px) var(--sp, 28px); }
  .scene.static .fallback { display: block; }
  .scene.static canvas { display: none; }
</style>
</head>
<body>
<div class="scene" data-lobo-scene>
  <canvas id="gd" aria-hidden="true"></canvas>
  <div class="fallback" aria-hidden="true"></div>
</div>
<script>
// ============================================================================
// CONFIG: a fonte da verdade. Schema em ../references/config-schema.md
// Canvas 2D: uma grade de células; cada célula desloca por ruído (warp), por onda (wave) e pelo ponteiro.
// ============================================================================
const PRESETS = {
  "dot-matrix": { mode: "dots",  spacing: 28, size: 1.6, color: "#FFFFFF", color2: "#25B8FF", bg: "#0A0A0C", warp: 0.35, warpScale: 1.2, wave: 0.0, speed: 0.4, pointer: 0.8, pointerRadius: 160, fade: 0.35 },
  "blueprint":  { mode: "lines", spacing: 36, size: 1.0, color: "#2F6BFF", color2: "#9FC3FF", bg: "#061024", warp: 0.25, warpScale: 0.9, wave: 0.0, speed: 0.3, pointer: 0.6, pointerRadius: 200, fade: 0.25 },
  "plus-grid":  { mode: "plus", hover: "vortex",  spacing: 32, size: 5.0, color: "#C8FF5A", color2: "#FFFFFF", bg: "#0B0F08", warp: 0.5, warpScale: 1.6, wave: 0.0, speed: 0.5, pointer: 0.9, pointerRadius: 180, fade: 0.3 },
  "sonar":      { mode: "ring", hover: "pull",  spacing: 24, size: 2.4, color: "#145E5A", color2: "#C8FFF4", bg: "#03151A", warp: 0.1, warpScale: 1.0, wave: 1.0, speed: 0.7, pointer: 0.5, pointerRadius: 140, fade: 0.45 },
  "ascii-rain": { mode: "ascii", hover: "glow", spacing: 18, size: 11,  color: "#39FF88", color2: "#E6FFF0", bg: "#040806", warp: 0.6, warpScale: 1.4, wave: 0.3, speed: 0.9, pointer: 0.7, pointerRadius: 150, fade: 0.4 },
  "star-dust":  { mode: "star",  spacing: 34, size: 5.0, color: "#FFD166", color2: "#FFFFFF", bg: "#0B0804", warp: 0.3, warpScale: 1.0, wave: 0.2, speed: 0.4, hover: "glow", pointer: 0.9, pointerRadius: 200, fade: 0.3 },
  "diamond-net":{ mode: "diamond", spacing: 30, size: 4.0, color: "#F72585", color2: "#4CC9F0", bg: "#0A0612", warp: 0.45, warpScale: 1.3, wave: 0.0, speed: 0.5, hover: "push", pointer: 0.8, pointerRadius: 170, fade: 0.3 },
  "topo":       { mode: "triangle", hover: "scatter", spacing: 26, size: 4.0, color: "#FF8A1F", color2: "#FFE6A7", bg: "#120804", warp: 0.8, warpScale: 0.7, wave: 0.0, speed: 0.25, pointer: 0.6, pointerRadius: 220, fade: 0.3 },
  // ---------------- quarta leva (10) ----------------
  "paper-dots":       { mode: "dots",     spacing: 24, size: 1.8, color: "#1A1A1A", color2: "#FF4D2E", bg: "#F3F0EA", warp: 0.2, warpScale: 1.0, wave: 0.0, speed: 0.4, hover: "pull", pointer: 0.8, pointerRadius: 180, fade: 0.2 },
  "neon-squares":     { mode: "square",   spacing: 30, size: 4.0, color: "#00F0FF", color2: "#FF00E5", bg: "#05010A", warp: 0.4, warpScale: 1.2, wave: 0.0, speed: 0.5, hover: "vortex", pointer: 0.9, pointerRadius: 200, fade: 0.3 },
  "ring-pond":        { mode: "ring",     spacing: 28, size: 5.0, color: "#3A86FF", color2: "#FFFFFF", bg: "#020814", warp: 0.1, warpScale: 1.0, wave: 0.8, speed: 0.6, hover: "push", pointer: 0.7, pointerRadius: 170, fade: 0.35 },
  "triangle-storm":   { mode: "triangle", spacing: 26, size: 4.5, color: "#FF006E", color2: "#FFBE0B", bg: "#0E0306", warp: 0.9, warpScale: 2.2, wave: 0.0, speed: 1.0, hover: "scatter", pointer: 0.9, pointerRadius: 190, fade: 0.3 },
  "cross-blueprint":  { mode: "cross",    spacing: 32, size: 4.0, color: "#2F6BFF", color2: "#FFFFFF", bg: "#061024", warp: 0.15, warpScale: 0.9, wave: 0.0, speed: 0.3, hover: "push", pointer: 0.6, pointerRadius: 200, fade: 0.25 },
  "star-field-dense": { mode: "star",     spacing: 26, size: 5.5, color: "#FFFFFF", color2: "#FFD166", bg: "#02030A", warp: 0.2, warpScale: 1.0, wave: 0.3, speed: 0.4, hover: "glow", pointer: 0.9, pointerRadius: 220, fade: 0.3 },
  "diamond-gold":     { mode: "diamond",  spacing: 26, size: 4.0, color: "#8A6A2B", color2: "#FFE6A3", bg: "#0C0904", warp: 0.3, warpScale: 1.1, wave: 0.0, speed: 0.4, hover: "glow", pointer: 0.9, pointerRadius: 200, fade: 0.3 },
  "ascii-blue":       { mode: "ascii",    spacing: 16, size: 13,  color: "#5CB3FF", color2: "#FFFFFF", bg: "#01060F", warp: 0.6, warpScale: 1.3, wave: 0.5, speed: 0.7, hover: "push", pointer: 0.8, pointerRadius: 160, fade: 0.15 },
  "lines-flow":       { mode: "lines",    spacing: 22, size: 4.0, color: "#B57CFF", color2: "#F72585", bg: "#0A0612", warp: 1.0, warpScale: 0.8, wave: 0.0, speed: 0.5, hover: "vortex", pointer: 0.8, pointerRadius: 200, fade: 0.3 },
  "plus-minimal":     { mode: "plus",     spacing: 44, size: 6.0, color: "#BDBDBD", color2: "#000000", bg: "#FFFFFF", warp: 0.1, warpScale: 1.0, wave: 0.0, speed: 0.3, hover: "pull", pointer: 0.8, pointerRadius: 220, fade: 0.1 }
};
const CONFIG = {
  preset: "dot-matrix",
  mode: "dots",            // glifo: dots | ring | square | diamond | triangle | star | plus | cross | lines | ascii
  spacing: 28,             // px CSS entre células
  size: 1.6,               // raio do ponto, metade do braço do plus/cross, tamanho da fonte no ascii
  color: "#FFFFFF", color2: "#25B8FF", bg: "#0A0A0C",
  warp: 0.35,              // 0..1 deslocamento por ruído (em frações de spacing)
  warpScale: 1.2,          // frequência do ruído
  wave: 0.0,               // 0..1 onda radial que pulsa do centro
  speed: 0.4,
  hover: "push",           // push | pull | vortex | scatter | glow — efeito do cursor (no toque, arrastando)
  pointer: 0.8,            // 0..1 força do hover
  pointerRadius: 160,      // px CSS
  hoverGlow: 1.0,          // 0..2 quanto acende e cresce perto do cursor (todos os modos)
  hoverSoft: 0.6,          // 0..1 borda do raio
  fade: 0.35,              // 0..1 vinheta (células somem nas bordas)
  seed: 7, dprMax: 1.5
};

(function () {
  const scene = document.querySelector("[data-lobo-scene]");
  const canvas = document.getElementById("gd");
  const motionOff = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const coarse = matchMedia("(hover: none) and (pointer: coarse)").matches;
  const isBot = /bot|crawl|spider|slurp|headless|lighthouse|pagespeed/i.test(navigator.userAgent);
  const stats = { frames: 0, draws: 0, links: 0, lost: 0, restored: 0, resizes: 0, cells: 0 };
  let raf = 0, last = performance.now(), time = 0, dirty = true, visible = !document.hidden, inView = true, w = 0, h = 0, dpr = 0, ctx = null;
  const pointer = { x: -9999, y: -9999, tx: -9999, ty: -9999, active: false, idleAt: 0 };

  const cfg = Object.assign({}, CONFIG);
  const params = new URLSearchParams(location.search);
  function setConfig(changes) { const ignored = []; for (const k in changes) { if (k in cfg) cfg[k] = changes[k]; else ignored.push(k); } applyCss(); dirty = true; schedule(); return { ignored }; }
  if (params.get("preset") && PRESETS[params.get("preset")]) { cfg.preset = params.get("preset"); setConfig(PRESETS[cfg.preset]); }
  if (params.get("s")) { try { setConfig(JSON.parse(atob(params.get("s").replace(/-/g, "+").replace(/_/g, "/")))); } catch (e) {} }
  function exportState() { return location.origin + location.pathname + "?s=" + btoa(JSON.stringify(cfg)).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, ""); }
  function applyCss() { scene.style.setProperty("--bg", cfg.bg); scene.style.setProperty("--c", cfg.color); scene.style.setProperty("--sp", cfg.spacing + "px"); }
  window.__lobo = { config: cfg, presets: PRESETS, stats, setConfig, exportState, family: "grid-dots-field" };
  applyCss();
  if (isBot) { scene.classList.add("static"); return; }
  ctx = canvas.getContext("2d", { alpha: false, desynchronized: true });
  if (!ctx) { scene.classList.add("static"); return; }

  // ---- ruído 2D por valor, com seed (barato o bastante pra ~3k células por frame) ----
  function hash(ix, iy) { let n = (ix * 374761393 + iy * 668265263 + cfg.seed * 1442695041) | 0; n = Math.imul(n ^ (n >>> 13), 1274126177); return ((n ^ (n >>> 16)) >>> 0) / 4294967296; }
  function noise(x, y) { const ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy, sx = fx * fx * (3 - 2 * fx), sy = fy * fy * (3 - 2 * fy);
    const a = hash(ix, iy), b = hash(ix + 1, iy), c = hash(ix, iy + 1), d = hash(ix + 1, iy + 1); return (a + (b - a) * sx + (c - a) * sy + (a - b - c + d) * sx * sy) * 2 - 1; }
  const hex = (h) => { const n = parseInt(h.replace("#", ""), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
  const GLYPHS = " .:-=+*#%@";
  const smooth = (x) => { x = Math.max(0, Math.min(1, x)); return x * x * (3 - 2 * x); };

  function resize() {
    const r = scene.getBoundingClientRect(), d = Math.min(cfg.dprMax, coarse ? 1.25 : 1.5, window.devicePixelRatio || 1);
    const nw = Math.max(1, Math.round(r.width)), nh = Math.max(1, Math.round(r.height));
    if (nw === w && nh === h && d === dpr) return false;
    w = nw; h = nh; dpr = d; canvas.width = Math.round(w * d); canvas.height = Math.round(h * d); ctx.setTransform(d, 0, 0, d, 0, 0); stats.resizes++; return true;
  }

  // ---- draw: as células vão pra 32 baldes (8 níveis de energia × 4 de alpha) e cada balde é UM fill/stroke.
  //      Um path por célula custa 1 fps em raster por software e ~10× mais draw calls em GPU. ----
  const BUCKETS = Array.from({ length: 32 }, () => []);
  // sprite por balde (dots): um disco pré-rasterizado e blitado com drawImage, o caminho mais barato do canvas 2D
  const SPRITES = new Map();
  function sprite(k, s, r, g, bl, a, shape) {
    const key = shape + ":" + k + ":" + s.toFixed(2) + ":" + r + "," + g + "," + bl + ":" + dpr; let c = SPRITES.get(key);
    if (!c) { if (SPRITES.size > 160) SPRITES.clear(); const S = s * dpr, px = Math.ceil((s * 2 + 2) * dpr), cx = px / 2; c = document.createElement("canvas"); c.width = c.height = px; const x = c.getContext("2d"); x.fillStyle = x.strokeStyle = `rgba(${r},${g},${bl},${a.toFixed(2)})`; x.lineWidth = Math.max(1, S * 0.35); x.beginPath();
      if (shape === "ring") { x.arc(cx, cx, S * 0.8, 0, 6.2832); x.stroke(); }
      else if (shape === "square") { x.fillRect(cx - S * 0.85, cx - S * 0.85, S * 1.7, S * 1.7); }
      else if (shape === "diamond") { x.moveTo(cx, cx - S); x.lineTo(cx + S, cx); x.lineTo(cx, cx + S); x.lineTo(cx - S, cx); x.closePath(); x.fill(); }
      else if (shape === "triangle") { x.moveTo(cx, cx - S); x.lineTo(cx + S * 0.95, cx + S * 0.7); x.lineTo(cx - S * 0.95, cx + S * 0.7); x.closePath(); x.fill(); }
      else if (shape === "star") { for (let i = 0; i < 10; i++) { const rr = i % 2 ? S * 0.42 : S, an = -1.5708 + i * 0.6283; x.lineTo(cx + Math.cos(an) * rr, cx + Math.sin(an) * rr); } x.closePath(); x.fill(); }
      else { x.arc(cx, cx, S, 0, 6.2832); x.fill(); }
      SPRITES.set(key, c); }
    return c;
  }
  function draw() {
    const sp = Math.max(6, cfg.spacing), cols = Math.ceil(w / sp) + 2, rows = Math.ceil(h / sp) + 2, ox = (w - (cols - 1) * sp) / 2, oy = (h - (rows - 1) * sp) / 2;
    const c1 = hex(cfg.color), c2 = hex(cfg.color2), cx = w / 2, cy = h / 2, diag = Math.hypot(cx, cy), t = time, ws = 0.12 * cfg.warpScale;
    ctx.fillStyle = cfg.bg; ctx.fillRect(0, 0, w, h);
    for (const b of BUCKETS) b.length = 0;
    let n = 0;
    for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++) {
      const gx = ox + i * sp, gy = oy + j * sp;
      const nx = noise(i * ws + t * 0.35, j * ws + 11.3), ny = noise(i * ws + 41.7, j * ws - t * 0.3);
      let dx = nx * cfg.warp * sp * 0.6, dy = ny * cfg.warp * sp * 0.6, e = 0.5 + 0.5 * nx;
      if (cfg.wave > 0) { const r = Math.hypot(gx - cx, gy - cy) / diag; const wv = Math.sin(r * 18 - t * 2.4); dx += (gx - cx) / (diag + 1) * wv * cfg.wave * sp * 0.5; dy += (gy - cy) / (diag + 1) * wv * cfg.wave * sp * 0.5; e = Math.max(e, 0.5 + 0.5 * wv * cfg.wave); }
      if (pointer.active && cfg.pointer > 0) { const px = gx - pointer.x, py = gy - pointer.y, d = Math.hypot(px, py), R = cfg.pointerRadius; if (d < R) {
          const edge = Math.max(0.02, cfg.hoverSoft) * R, near = cfg.pointer * smooth((R - d) / edge), ux = px / (d + 1), uy = py / (d + 1), k = near * sp * 0.9;
          if (cfg.hover === "pull") { dx -= ux * Math.min(k, d * 0.8); dy -= uy * Math.min(k, d * 0.8); }
          else if (cfg.hover === "vortex") { dx += -uy * k + ux * k * 0.15; dy += ux * k + uy * k * 0.15; }
          else if (cfg.hover === "scatter") { const n1 = noise(gx * 0.08 + t * 3, gy * 0.08), n2 = noise(gx * 0.08 + 50, gy * 0.08 - t * 3); dx += n1 * k * 1.2; dy += n2 * k * 1.2; }
          else if (cfg.hover !== "glow") { dx += ux * k; dy += uy * k; }
          e = Math.min(1, e + near * 1.2 * cfg.hoverGlow); } }
      const x = gx + dx, y = gy + dy;
      const vx = Math.abs(x - cx) / cx, vy = Math.abs(y - cy) / cy, v = 1 - cfg.fade * Math.max(0, Math.max(vx, vy) * 1.15 - 0.15);
      const a = Math.max(0, Math.min(1, (0.35 + 0.65 * e) * v)); if (a < 0.03) continue;
      const eb = Math.min(7, Math.floor(e * 8)), ab = Math.min(3, Math.floor(a * 4));
      BUCKETS[eb * 4 + ab].push(x, y, nx, ny); n++;
    }
    // estilo uma vez por balde; cada célula é um path pequeno (arc) ou fillRect — nunca stroke, nunca um path gigante:
    // em raster por GPU, stroke de traço curto e path com milhares de subpaths são os dois caminhos lentos.
    if (cfg.mode === "ascii") { ctx.font = `${cfg.size}px ui-monospace, Menlo, monospace`; ctx.textAlign = "center"; ctx.textBaseline = "middle"; }
    const lw = Math.max(0.6, cfg.size * 0.35);
    for (let k = 0; k < 32; k++) {
      const b = BUCKETS[k]; if (!b.length) continue;
      const e = ((k >> 2) + 0.5) / 8, a = ((k & 3) + 0.5) / 4, s = cfg.size * (0.7 + 0.6 * e);
      const r = Math.round(c1[0] + (c2[0] - c1[0]) * e), g = Math.round(c1[1] + (c2[1] - c1[1]) * e), bl = Math.round(c1[2] + (c2[2] - c1[2]) * e);
      ctx.fillStyle = `rgba(${r},${g},${bl},${a.toFixed(2)})`;
      if (cfg.mode === "dots" || cfg.mode === "ring" || cfg.mode === "square" || cfg.mode === "diamond" || cfg.mode === "triangle" || cfg.mode === "star") { const sp2 = sprite(k, s, r, g, bl, a, cfg.mode), half = sp2.width / (2 * dpr); for (let q = 0; q < b.length; q += 4) ctx.drawImage(sp2, b[q] - half, b[q + 1] - half, half * 2, half * 2); }
      else if (cfg.mode === "plus") { for (let q = 0; q < b.length; q += 4) { const x = b[q], y = b[q + 1]; ctx.fillRect(x - s, y - lw / 2, s * 2, lw); ctx.fillRect(x - lw / 2, y - s, lw, s * 2); } }
      else if (cfg.mode === "cross") { for (let q = 0; q < b.length; q += 4) { ctx.setTransform(dpr, 0, 0, dpr, b[q] * dpr, b[q + 1] * dpr); ctx.rotate(0.7854); ctx.fillRect(-s, -lw / 2, s * 2, lw); ctx.fillRect(-lw / 2, -s, lw, s * 2); } ctx.setTransform(dpr, 0, 0, dpr, 0, 0); }
      else if (cfg.mode === "lines") { const L = sp * 0.42; for (let q = 0; q < b.length; q += 4) { ctx.setTransform(dpr, 0, 0, dpr, b[q] * dpr, b[q + 1] * dpr); ctx.rotate(Math.atan2(b[q + 3], b[q + 2]) * 0.5); ctx.fillRect(-L, -lw / 2, L * 2, lw); } ctx.setTransform(dpr, 0, 0, dpr, 0, 0); }
      else { const gl = GLYPHS[Math.min(GLYPHS.length - 1, Math.floor(e * (GLYPHS.length - 1) + 0.5))]; for (let q = 0; q < b.length; q += 4) ctx.fillText(gl, b[q], b[q + 1]); }
    }
    stats.cells = n; stats.draws++; stats.frames++;
  }

  function frame(now) {
    raf = 0;
    const dt = Math.max(0, Math.min(0.05, (now - last) / 1000)); last = now;
    if (!motionOff) time += dt * cfg.speed;
    const k = 1 - Math.pow(1 - 0.18, dt * 60);
    if (pointer.active) { pointer.x += (pointer.tx - pointer.x) * k; pointer.y += (pointer.ty - pointer.y) * k; if (now - pointer.idleAt > 2500 && Math.hypot(pointer.tx - pointer.x, pointer.ty - pointer.y) < 0.5) { pointer.active = false; pointer.tx = pointer.ty = -9999; dirty = true; } }
    const resized = resize();
    if (motionOff && !dirty && !resized && !pointer.active) return;   // reduced motion: assentado
    draw(); dirty = false;
    if (visible && inView && (!motionOff || pointer.active)) raf = requestAnimationFrame(frame);
  }
  function schedule() { if (!raf && visible && inView && ctx) { last = performance.now(); raf = requestAnimationFrame(frame); } }
  new IntersectionObserver((es) => { inView = es[0].isIntersecting; if (inView) schedule(); }, { rootMargin: "100% 0px" }).observe(scene);
  document.addEventListener("visibilitychange", () => { visible = !document.hidden; if (visible) schedule(); });
  window.addEventListener("resize", () => { dirty = true; schedule(); }, { passive: true });
  {
    let pressed = false;
    const track = (e) => { const r = scene.getBoundingClientRect(); pointer.tx = e.clientX - r.left; pointer.ty = e.clientY - r.top; if (!pointer.active) { pointer.x = pointer.tx; pointer.y = pointer.ty; } pointer.active = true; pointer.idleAt = performance.now(); schedule(); };
    window.addEventListener("pointermove", (e) => { if (e.pointerType !== "mouse" && !pressed) return; track(e); }, { passive: true });
    canvas.addEventListener("pointerdown", (e) => { if (e.pointerType === "mouse") return; pressed = true; track(e); }, { passive: true });
    const up = (e) => { if (e.pointerType === "mouse") return; pressed = false; pointer.idleAt = performance.now() - 2000; };   // solta: some em 0.5 s
    window.addEventListener("pointerup", up, { passive: true }); window.addEventListener("pointercancel", up, { passive: true });
    window.addEventListener("pointerleave", () => { pointer.idleAt = 0; });
    canvas.style.touchAction = "none";
  }
  schedule();
})();
</script>
</body>
</html>
